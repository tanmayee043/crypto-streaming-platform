# Production stack for the VM: docker compose -f docker-compose.prod.yaml up -d
# Secrets come from .env on the VM (made by deploy/setup-vm.sh), never from the repo.
#
# Only Caddy publishes public ports (80, 443). Prometheus, Grafana and Jaeger are bound to the
# VM's localhost (reach them through an SSH tunnel, see docs/runbook.md). Kafka and Postgres
# publish nothing. `restart: unless-stopped` plus Docker starting on boot brings everything
# back after a reboot.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }   # rotate, so logs can't fill the disk

x-service: &service
  image: ${APP_IMAGE:-ghcr.io/tanmayee043/crypto-streaming-platform:latest}
  build: .
  restart: unless-stopped
  logging: *logging
  env_file: .env
  environment: &service-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    POSTGRES_HOST: postgres
    METRICS_HOST: 0.0.0.0   # inside Docker's private network only; no port is published
  depends_on:
    kafka-init: { condition: service_completed_successfully }
    postgres: { condition: service_healthy }

services:
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    logging: *logging
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # retention: whichever limit is hit first (7 days, or 1 GB per partition)
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 20s
      retries: 20

  # one-shot: creates the topics if they don't exist yet, then exits
  kafka-init:
    image: apache/kafka:4.3.1
    restart: "no"
    logging: *logging
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in crypto-trades trade-analytics crypto-trades-dlq trade-analytics-dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1 || exit 1
        done

  postgres:
    image: postgres:16.15
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  producer:
    <<: *service
    command: ["python", "producer.py"]

  detector:
    <<: *service
    command: ["python", "anomaly_detector.py"]
    environment:
      <<: *service-env
      DETECTOR_GROUP_INSTANCE_ID: detector-1   # restarts get their partitions back at once

  storage:
    <<: *service
    command: ["python", "storage_consumer.py"]
    environment:
      <<: *service-env
      STORAGE_GROUP_INSTANCE_ID: storage-1

  gap-checker:
    <<: *service
    command: ["python", "gap_checker.py"]

  retention:
    <<: *service
    command: ["python", "retention.py"]

  api:
    <<: *service
    # --forwarded-allow-ips=*: safe because only Caddy can reach this port, and it means rate
    # limits see the visitor's real IP from Caddy's X-Forwarded-For header
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers",
              "--forwarded-allow-ips=*", "--no-access-log"]
    environment:
      <<: *service-env
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    image: caddy:2.10.0
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env, e.g. yourname.duckdns.org}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # keeps the HTTPS certificate across restarts
      - caddy_config:/config
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=35d    # enough to show a 30-day completeness record
      - --storage.tsdb.retention.size=2GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/jaeger:2.8.0
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  pgdata:
  kafka_data:
  caddy_data:
  caddy_config:
  prometheus_data:
