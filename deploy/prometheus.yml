# Production: everything runs in Docker, so services are reached by name on the private network.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: producer
    static_configs: [{ targets: ["producer:8001"] }]
  - job_name: detector
    static_configs: [{ targets: ["detector:8002"] }]
  - job_name: storage
    static_configs: [{ targets: ["storage:8003"] }]
  - job_name: gap_checker
    static_configs: [{ targets: ["gap-checker:8004"] }]
  - job_name: retention
    static_configs: [{ targets: ["retention:8005"] }]
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
