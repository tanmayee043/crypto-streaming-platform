# After CI passes on main: build the ARM image, push it to GitHub's registry, deploy to the VM.
# The deploy job only runs once the repo variable DEPLOY_ENABLED is "true" (docs/deploy-oracle.md),
# so nothing goes anywhere until the VM is ready and you choose to turn it on.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:   # also runnable by hand from the Actions tab

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/crypto-streaming-platform
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-qemu-action@v3   # lets this x86 runner build for ARM
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.SHA }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Delete old images, keeping the newest 3 (stays inside the free storage limit)
        uses: actions/delete-package-versions@v5
        with:
          package-name: crypto-streaming-platform
          package-type: container
          min-versions-to-keep: 3

  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the stack definition to the VM
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          tar czf - docker-compose.prod.yaml schema.sql deploy migrations observability/grafana \
            | ssh -i ~/.ssh/id_deploy "$TARGET" 'tar xzf - -C /opt/crypto-streaming'
      - name: Deploy (rolls back by itself if the new version is unhealthy)
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/id_deploy "$TARGET" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh -i ~/.ssh/id_deploy "$TARGET" "bash /opt/crypto-streaming/deploy/deploy.sh $IMAGE:$SHA"
      - name: Log the VM out of the registry
        if: always()
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/id_deploy "$TARGET" "docker logout ghcr.io" || true
