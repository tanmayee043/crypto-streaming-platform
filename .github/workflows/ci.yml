name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Check types
        run: mypy .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Unit tests plus integration tests (Testcontainers starts a throwaway Postgres)
      - run: pytest -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      # A real browser against the real API and a throwaway Postgres
      - run: pytest -m e2e -v

  crash-test:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements.txt
      - name: Start Kafka and Postgres
        run: |
          cp .env.example .env
          docker compose up -d --wait kafka postgres
      - name: Kill the storage consumer 20 times, then check for missing/duplicate rows
        run: python scripts/crash_test.py --kills 20
      - name: Kill the anomaly detector 10 times, then check rows and scores
        run: python scripts/detector_crash_test.py --file tests/data/sample_trades.jsonl --kills 10 --rate 100
      - name: Upload crash test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-test-results
          path: results/
          retention-days: 14
      - name: Stop services
        if: always()
        run: docker compose down -v
